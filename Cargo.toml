[package]
name = "armature-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-testkit"
homepage = "https://quinnjr.github.io/armature"
description = "Deterministic test harnesses (HTTP stubs, containers) for the Armature framework"
publish = false

[features]
default = []
# Docker-backed helpers (testcontainers, Pebble ACME). Off by default so the
# standard `cargo test` never requires Docker.
containers = ["dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
testcontainers = { version = "0.28.0", optional = true }
testcontainers-modules = { version = "0.15.0", features = ["redis", "postgres"], optional = true }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
